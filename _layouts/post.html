---
layout: default
---
<a href="{{ '/notes/' | relative_url }}" class="back-link mono" style="padding-top: 80px;">← notes</a>
<article class="post">
  <header class="post-header">
    <div class="mono caps note-date">{{ page.date | date: "%d %b %Y" }}</div>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
